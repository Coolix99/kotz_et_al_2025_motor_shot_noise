[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cilia"
version = "0.2.0"
description = "Tools for analyzing cilia data and running PINNs"
authors = [
    { name="Maximilian Kotz", email="kotzmax@gmail.com" }
]
readme = "README.md"
license = { text = "MIT" }  # or whatever you use
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pymatreader",
    "pyyaml",
    "torch"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[project.urls]
Homepage = "https://github.com/Coolix99/cilia"

[tool.setuptools.packages.find]
where = ["src"]